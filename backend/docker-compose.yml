services:
  postgres:
    image: postgres:17-alpine
    container_name: usafi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-usafi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-usafi_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-usafi}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - usafi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-usafi} -d ${POSTGRES_DB:-usafi}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  usafi_pg_data:
    name: usafi_pg_data
